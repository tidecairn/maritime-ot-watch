name: Refresh Watch intelligence

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: watch-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - run: python -m unittest discover -s tests -v
      - run: python scripts/update_watch.py
      - run: python -m unittest discover -s tests -v
      - run: node --check assets/watch.js
      - run: python scripts/build.py
      - name: Commit verified data only when changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/watch.json data/watch.sha256
          git diff --cached --quiet || git commit -m "watch: refresh public-source intelligence"
          git push
