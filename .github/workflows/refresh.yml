name: Refresh Watch intelligence

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: watch-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - run: python -m unittest discover -s tests -v
      - run: python scripts/update_watch.py
      - run: python -m unittest discover -s tests -v
      - run: node --check assets/watch.js
      - run: python scripts/build.py
      - name: Commit verified data only when changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/watch.json data/watch.sha256
          git diff --cached --quiet || git commit -m "watch: refresh public-source intelligence"
          git push
